<?xml version="1.0" encoding="UTF-8"?>
<!-- Scattered shoe prints, tiled across the page background like the trails
     that wander over the Marauder's Map. One print is defined once and
     re-used at different angles so the tile does not read as a grid. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <defs>
    <g id="print">
      <ellipse cx="0" cy="-6" rx="7" ry="11"/>
      <ellipse cx="0" cy="12" rx="5.2" ry="5.8"/>
    </g>
  </defs>
  <g fill="#3d2a17">
    <use href="#print" transform="translate(26 30) rotate(24)"/>
    <use href="#print" transform="translate(52 46) rotate(24)"/>
    <use href="#print" transform="translate(78 62) rotate(24)"/>

    <use href="#print" transform="translate(196 24) rotate(-38)"/>
    <use href="#print" transform="translate(170 46) rotate(-38)"/>

    <use href="#print" transform="translate(120 118) rotate(96)"/>
    <use href="#print" transform="translate(148 128) rotate(96)"/>

    <use href="#print" transform="translate(34 148) rotate(-14)"/>
    <use href="#print" transform="translate(46 176) rotate(-14)"/>

    <use href="#print" transform="translate(214 152) rotate(58)"/>
    <use href="#print" transform="translate(232 176) rotate(58)"/>

    <use href="#print" transform="translate(104 214) rotate(-72)"/>
    <use href="#print" transform="translate(76 226) rotate(-72)"/>

    <use href="#print" transform="translate(178 236) rotate(12)"/>
  </g>
</svg>
