<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Аудиокниги Гарри Поттер</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9c49a">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Аудиокниги Гарри Поттер">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Old Standard TT reads as antique letterpress and Marck Script as a fine
     ink nib; both carry Cyrillic, which the usual "old book" faces (Cinzel,
     IM Fell) do not — without it the Russian titles fall back to Times. -->
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Marck+Script&display=swap" rel="stylesheet">

<!-- ?v= is a cache buster: GitHub Pages serves assets with max-age=600, so
     without it a phone keeps running the previous app.js for ten minutes
     after a deploy. Bump it whenever app.js or style.css changes. -->
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<header class="app-header">
  <h1>Аудиокниги Гарри Поттер</h1>
  <p class="subtitle">господа Лунатик, Бродяга, Хвост и Сохатый<br>с гордостью представляют</p>
</header>

<main>

  <section class="sleep-timer">
    <div class="timer-row">
      <span class="timer-icon">☾</span>
      <button class="timer-btn" data-minutes="15" type="button">15</button>
      <button class="timer-btn" data-minutes="30" type="button">30</button>
      <button class="timer-btn" data-minutes="45" type="button">45</button>
      <button class="timer-btn" data-minutes="60" type="button">60</button>
      <span id="timerCountdown" class="timer-countdown" hidden>—</span>
      <button id="timerCancelBtn" type="button" class="timer-cancel" hidden aria-label="Отменить таймер">✕</button>
    </div>
  </section>

  <section class="book-list-section">
    <div class="book-list-header">
      <button id="randomPlayBtn" class="random-button" type="button">Наугад</button>
    </div>
    <ul id="bookList" class="book-list"></ul>
    <p id="emptyState" class="empty-state" hidden>Книги пока не добавлены.</p>
  </section>

  <p class="oath">Торжественно клянусь, что замышляю шалость и только шалость</p>

</main>

<audio id="player" preload="metadata"></audio>

<script src="app.js?v=7"></script>
</body>
</html>
